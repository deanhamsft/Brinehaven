          <style>
            .image-container {
              width: 100%;

              display: flex;

              justify-content: center;
              overflow: hidden;

            .image {
              width: 100%;
              height: 100%;
              object-fit: cover;
              opacity: 0;
              animation: fadeIn 0.3s ease-in-out forwards;
            }
            
            @keyframes fadeIn {
              from {
                opacity: 0;
              }
              to {
                opacity: 1;
              }
            }

        <body style="height: 100%; margin: 0px;" data-new-gr-c-s-check-loaded="14.1265.0" data-gr-ext-installed="">

          </div>
          <script>
            let parentWindow = window.top;
            if (!window.top) {
              parentWindow = window.parent;
            }
            
            const topWindowOrigin = 'https://x.com';
            parentWindow.postMessage({type: 'on_load' }, topWindowOrigin);

            // Send keydown events to the parent window
            document.addEventListener('keydown', function(event) {
              parentWindow.postMessage(
                {
                  type: "keydown",
                  key: event.key,
                  code: event.code,
                },
                topWindowOrigin
              );
            });

            const img = document.getElementById("image");
            img.onerror = function () {
              this.remove();
              parentWindow.postMessage(
                {
                  type: "onerror",
                  src: img.src,
                },
                topWindowOrigin
              );
            };
          </script>
